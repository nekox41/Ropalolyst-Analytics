[package]
name = "ropalolyst-desktop"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Ropalolyst speedrun analysis desktop application"
build = "build.rs"

[workspace]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-runtime = "2"
ropalolyst-core = { path = "../crates/ropalolyst-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_System_Threading","Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
strip = true
panic = "unwind"

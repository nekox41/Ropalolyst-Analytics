    <radialGradient id="halo"><stop stop-color="#38d9df" stop-opacity=".24"/><stop offset="1" stop-color="#38d9df" stop-opacity="0"/></radialGradient>
    <linearGradient id="hair" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#ffe0ed"/><stop offset=".38" stop-color="#f5a9cb"/><stop offset="1" stop-color="#c96eae"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0ed"/><stop offset="1" stop-color="#e8b8c9"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38445d"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a2ffff"/><stop offset="1" stop-color="#36bfcf"/></linearGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ropalolyst Analytics</title>
  <desc id="desc">Pink-haired catgirl with round glasses and a white flower, framed by a cyan energy ring.</desc>

name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v0.1.0"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64 release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate Windows application icon
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_icon.py
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build executable
        run: cargo build --release -p ropalolyst-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ropalolyst-analytics.exe dist/
          @'
          Ropalolyst Analytics v0.1.0
          
          1. 启动 Warframe，或先启动本程序。
          2. 程序会自动定位并监控 %LOCALAPPDATA%\\Warframe\\EE.log。
          3. 正常完成蝠力使任务，程序会自动记录五阶段成绩。
          4. 按 Q 或 Esc 退出。
          
          成绩数据库：ropalolyst-analytics.sqlite3（保存在日志目录）。
          '@ | Set-Content -Encoding utf8 dist/使用说明.txt
          Compress-Archive -Path dist/* -DestinationPath ropalolyst-analytics-windows-x64.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: ${{ github.sha }}
          name: Ropalolyst Analytics v0.1.0
          body: |
            ## Ropalolyst Analytics v0.1.0

            第一版正式发布。

            - 实时监控 Warframe EE.log
            - 自动记录蝠力使任务的五阶段竞速成绩
            - 显示累计时间、阶段耗时与历史平均差值
            - 本地保存历史成绩
            - Windows x64 独立可执行文件，已嵌入项目图标
          generate_release_notes: true
          files: ropalolyst-analytics-windows-x64.zip

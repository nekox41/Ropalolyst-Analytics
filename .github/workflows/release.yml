name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64 release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build executable
        run: cargo build --release -p ropalolyst-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ropalolyst-analytics.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ropalolyst-analytics-windows-x64.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ropalolyst-analytics-windows-x64.zip

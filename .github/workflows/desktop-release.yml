name: Desktop Release v0.2.0
on:
  push:
    branches: [release/v0.2.0]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Generate icons
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_icon.py
      - name: Install frontend tooling
        run: npm install --no-audit --no-fund
      - name: Frontend and Rust checks
        run: |
          npm run check
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build portable EXE and NSIS installer
        run: npm run build -- --bundles nsis
      - name: Collect release files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/ropalolyst-desktop.exe dist/ropalolyst-analytics-v0.2.0-portable.exe
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Missing Windows NSIS installer" }
          Copy-Item $installer.FullName "dist/ropalolyst-analytics-v0.2.0-setup.exe"
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
          Compress-Archive -Path dist/ropalolyst-analytics-v0.2.0-portable.exe -DestinationPath dist/ropalolyst-analytics-v0.2.0-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ropalolyst-analytics-v0.2.0-windows
          path: dist/*
          if-no-files-found: error
      - name: Publish v0.2.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: ${{ github.sha }}
          name: Ropalolyst Analytics v0.2.0
          body: |
            ## v0.2.0 · 全新桌面版

            - 全新 PTANext 风格的中文 Tauri 2 桌面界面。
            - 主页、历史记录、统计分析和设置。
            - 保留现有五阶段蝠力使日志解析，自动保存每场记录。
            - SQLite 原位迁移，支持重命名、收藏、删除与重放去重。
            - 游戏内透明计时 Overlay，可调整位置、缩放与不透明度。
            - Windows x64 安装包与便携版，无需修改或注入 Warframe。

            便携版需要系统已安装 Microsoft Edge WebView2 Runtime。
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

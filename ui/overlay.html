<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ropalolyst Timer</title><link rel="stylesheet" href="overlay.css"><script defer src="overlay.js"></script></head>
<body><main id="overlay">
  <header id="handle"><span class="brand">ROPALOLYST ANALYTICS</span><span id="state"></span><button id="finish" type="button" hidden>完成调整</button></header>
  <section class="timer card"><span id="label">任务用时</span><strong id="elapsed">00:00.000</strong></section>
  <button id="resize" type="button" aria-label="拖动调整大小" hidden>◢</button>
</main></body></html>
